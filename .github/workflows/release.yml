name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, no leading v (e.g. 1.1.5, or 2.0.0-rc.1 from a release branch)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate branch, version and guard against existing tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/main)
              echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Final versions (X.Y.Z) only from main, got: $VERSION"; exit 1; }
              ;;
            refs/heads/release/*)
              echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' || { echo "Only release candidates (X.Y.Z-rc.N) from a release branch, got: $VERSION"; exit 1; }
              ;;
            *)
              echo "Release must be dispatched from main or a release/* branch, got $GITHUB_REF"; exit 1
              ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on origin"; exit 1
          fi

      - name: Bump cloudexit/version.py
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"$VERSION\"/" cloudexit/version.py
          grep -q "^__version__ = \"$VERSION\"$" cloudexit/version.py || { echo "sed did not update version"; exit 1; }

      - name: Commit, tag, and push to the dispatched branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin HEAD "refs/tags/v$VERSION"
