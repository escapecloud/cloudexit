[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudexit"
dynamic = ["version"]
description = "Open-source cloud exit assessment CLI for evaluating cloud lock-in risk."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-identity==1.26.0",
    "azure-mgmt-resource==24.0.0",
    "azure-mgmt-authorization==4.0.0",
    "azure-mgmt-costmanagement==4.0.1",
    "boto3==1.43.117",
    "botocore==1.43.117",
    "rich==15.0.0",
    "Jinja2==3.1.6",
    "reportlab==5.1.0",
    "pillow==13.0.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "jsonschema",
    "PyYAML",
]

[project.scripts]
cloudexit = "main:main"

[tool.ruff.lint]
# ruff 0.16 enlarged its default rule set; keep the previous defaults until
# the new rules are adopted deliberately
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.dynamic]
version = {attr = "utils.version.__version__"}

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "core.*", "utils", "utils.*"]
