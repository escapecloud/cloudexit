publiccodeYmlVersion: "0.8.0"
name: cloudexit
url: https://github.com/escapecloud/cloudexit
landingURL: https://escapecloud.io
platforms:
  - linux
  - mac
  - windows
categories:
  - cloud-management
developmentStatus: stable
softwareType: standalone/backend
softwareVersion: 2.0.0

description:
  en:
    shortDescription: Open-source tool for cloud exit assessments
    longDescription: Open-source command-line tool for cloud exit assessments
      that helps organizations evaluate risks, dependencies, and alternative
      strategies before leaving a cloud provider. It inspects an AWS or Azure
      scope with read-only credentials, or a Terraform/OpenTofu state file, and
      writes a self-contained HTML report and a PDF executive summary on the
      machine that ran it. It can also estimate the one-time data egress fee of
      moving the data out, at the provider's list prices. It runs fully offline
      and needs no account; results can optionally be uploaded to a platform.
    features:
      - cloud exit assessment
      - risk management
      - alternative technology analysis
      - resource and cost inventory
      - data egress estimation
      - infrastructure-as-code state scan
      - offline operation

